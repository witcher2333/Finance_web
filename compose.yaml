services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tango:tango_local_password@db:5432/tango
      APP_ORIGIN: http://localhost:3001
      NODE_ENV: production
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tango
      POSTGRES_PASSWORD: tango_local_password
      POSTGRES_DB: tango
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tango_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tango -d tango"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tango_pg_data:
