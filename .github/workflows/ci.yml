name: CI
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tango
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tango_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tango -d tango_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tango:test_password@localhost:5432/tango_test
      TEST_DATABASE_URL: postgres://tango:test_password@localhost:5432/tango_test
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
